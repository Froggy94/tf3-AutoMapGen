# Map sizes and aspect ratios of the game (automapgen.app.map_sizes.MapSizeCatalog), taken over from the legacy
# project. Tile counts from the game (base/content/gui.zip, gui/menu/new_game_or_map_settings_page.tl, getNumTiles);
# one tile = tile_m game metres = 64 heightmap pixels (checked: gigantic 1:2 = 80 x 160 tiles = 20.48 x 40.96 km).
tile_m = 256
formats = ["1x1", "1x2", "1x3", "1x4", "1x5"]     # format names in the game (tile counts partly differ slightly)

# key, label (the game's names), tiles = (width, height) per format in the order of `formats`
