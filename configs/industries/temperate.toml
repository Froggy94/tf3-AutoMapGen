# Industry planning of the temperate climate (climate presets on the temperate base climate extend this file):
# building sites, resource areas, placement, town specialisation, demand, names. Taken over from the legacy project
# (configs/industries/temperate.toml, configs/industry_mod.toml); own drawn resource areas (sketch) follow with the GUI.
# Widths with _game_m are game metres. The industry type names are game content (they become industry names in game).

[defaults.industries]
standard_only = true
preview_width = 2000
extra_industries = ["cement_plant", "paper_mill", "printing_press", "rubber_farm", "tire_factory", "vehicle_factory"]
extra_cargos = ["cement", "books", "paper", "rubber", "tires"]

[defaults.industries.mod]
mod_id = "DHE_industries_1"
folder = "industries/dhe"
trade_mod_id = "DHE_foreign_trade_1"
trade_folder = "industries/dhe_trade"

[defaults.industries.sites]
work_px = 4
town_clear_game_m = 700
site_near_game_m = 1500
site_full_share = 0.25
local_game_m = 300
noise = 0.5
noise_game_m = 2500
seed = 11
region_peak_share = 0.6
region_radius_game_m = 3000
region_spacing_game_m = 5000
region_min_km2 = 1

[defaults.industries.sites.sites.factory]
radius_game_m = 170
relief_game_m = 25
color = [240, 200, 40]
label = "factory (about +-150 m)"

