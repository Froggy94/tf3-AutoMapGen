# Climate preset "Alpine Realistic" (temperate base climate): named values for the map graphs. A graph uses a value
# where it exposes a parameter of that name ([defaults]: unused values are ignored). Projects extend the preset:
# extends = ["../presets/alpine_realistic.toml"]. Taken over from the legacy project
# (configs/climates/alpine_realistic.toml: [biomes], [slots.layers.*] landcover, [crops]).

extends = ["../industries/temperate.toml",   # the industry planning of the temperate climate
           "../publishing.toml", "../mod_texts/alpine.toml",   # names and texts of the published climate mod
           "../waterfall.toml",   # waterfall brushes of the climate mod
           "../map_mods.toml"]   # the map's own mods: roads, paths as streets, industry names

[defaults]
# Biomes 1-4 of the game by effective height (height + steepness bonus + noise) and the mountain mask
biome_limits_m = [1000, 1500, 1800]
mountains_from_m = 1800

# Import layers and their ESA WorldCover classes
forest_classes = [10]
meadow_classes = [20, 30, 50, 90, 100]
cropland_classes = [40]
rock_classes = [60]

# Crop types of the fields (each crop key needs the import layer crop_<key>); grass = base area of the cropland
[defaults.crops]
shares = { wheat = 0.4, corn = 0.2, soil = 0.1 }
by_size = [{ min_game_ha = 1.5, shares = { wheat = 0.5, corn = 0.3, grass = 0.1, soil = 0.1 } },
           { min_game_ha = 0.3, shares = { grass = 0.6, wheat = 0.3, soil = 0.1 } },
           { min_game_ha = 0, shares = { grass = 1 } }]

[defaults.crops.osm_tags]   # OSM crop= -> crop key ("" = grass)
maize = "corn"
corn = "corn"
grass = ""
hay = ""
wheat = "wheat"
barley = "wheat"
rye = "wheat"
oats = "wheat"
cereal = "wheat"

# Economy of the climate mod (nodes/climate/preset.py: EconomySettings)
[defaults.economy]
custom = false                          # own economy: no oil platforms, refinery at oil wells, glass works at sand pits
extra_industries = false                # also unlock industries and cargos of other climates (needs DHE Industries)
water_industry_fraction = "3.0 / 41.0"  # share of water industries among new industries (temperate: 6 / 41)
name = "Alps"
name_with_extra_industries = "Alps (all industries)"
removed_industries = ["oil_platform"]

# The climate mod: landscape type as data (nodes/climate/preset.py: ClimatePreset). Elevations in m a.s.l.;
# optional parts are switched off with enabled = false (or left out).
[defaults.climate]
name = "Alpine Realistic"
base_climate = "temperate"
no_cover_below = -0.5
top = 100000
map_preview_level = 1200

[defaults.climate.heights]
scree_start = 2100
scree_full = 2300
rock_start = 2200
rock_full = 2500
snow_hollow_start = 2400
snow_hollow_full = 2600
snow_start = 2500
snow_full = 2600
trees_dense_until = 1900
trees_sparse = 1900
tree_line = 2100
mountains_min = 1000

[defaults.climate.slots]
original = { rivers = 0, mountains = 1 }

[defaults.climate.slots.layers.forest]
