# Names, author and images of the published mods (nodes/mods.py: PublishingSettings). Presets extend this file.
# Climate mod: "<prefix> <landscape name> <reference>m Scale <factor> <beta_tag>".

[defaults.publishing]
prefix = "DHE"
beta_tag = "BETA"                       # at the end of the climate mods' names and IDs ("" = none)
author = "DHEModding"

[defaults.publishing.thumbnail]
size = [1400, 800]                      # aspect ratio like the published mods
# The game (LocalModHubBackend) shows image_00.tga from the mod folder for local mods without gallery, not .jpg
file = "image_00.tga"
# Cover in the mod hub (tile/gallery): where the game puts it itself ("add cover image", tested 2026-10-09)
cover_file = "_metadata/0.png"

[defaults.publishing.stamp]
font = "segoeuib.ttf"                   # a font file or a font name the system finds; missing = Pillow's default font
line_height = 0.2                       # font height per line as share of the image height
